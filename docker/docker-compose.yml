name: narau

x-app-image: &app-image
  image: narau-web
  build:
    context: ..
    dockerfile: docker/Dockerfile

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: narau
    ports:
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d narau"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/narau;
      mc anonymous set download local/narau;
      exit 0;
      "

  migrate:
    <<: *app-image
    command: ["sh", "-c", "cd packages/database && bunx prisma migrate deploy && bun run prisma/seed.ts"]
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/narau?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    <<: *app-image
    ports:
      - "3030:3030"
    environment:
      NODE_ENV: production
      APP_URL: http://localhost:3030
      DATABASE_URL: postgresql://app:app@db:5432/narau?schema=public
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: dev-secret-change-me
      AUTH_URL: http://localhost:3030
      AUTH_TRUST_HOST: "true"
      EMAIL_FROM: "Narau <no-reply@localhost>"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_SECURE: "false"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      FACEBOOK_CLIENT_ID: "${FACEBOOK_CLIENT_ID:-}"
      FACEBOOK_CLIENT_SECRET: "${FACEBOOK_CLIENT_SECRET:-}"
      TWITTER_CLIENT_ID: "${TWITTER_CLIENT_ID:-}"
      TWITTER_CLIENT_SECRET: "${TWITTER_CLIENT_SECRET:-}"
      LINKEDIN_CLIENT_ID: "${LINKEDIN_CLIENT_ID:-}"
      LINKEDIN_CLIENT_SECRET: "${LINKEDIN_CLIENT_SECRET:-}"
      STORAGE_ENABLED: "false"
      WIKIPEDIA_USER_AGENT: "${WIKIPEDIA_USER_AGENT:-NarauBot/0.1 (https://localhost:3030; contact@example.com)}"
      WIKIPEDIA_REQUEST_DELAY_MS: "${WIKIPEDIA_REQUEST_DELAY_MS:-1000}"
    volumes:
      - ../apps/web/public:/app/apps/web/public
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  db_data:
  minio_data:
