name: CI

on:
  push:
    branches: [dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: docker compose -f docker/docker-compose.yml --profile test build test
      - name: Lint
        run: docker compose -f docker/docker-compose.yml --profile test run --rm test bun run lint
      - name: Typecheck
        run: docker compose -f docker/docker-compose.yml --profile test run --rm test bun run typecheck
      - name: Test
        run: docker compose -f docker/docker-compose.yml --profile test run --rm test
      - name: Rebuild and start the complete stack
        run: docker compose -f docker/docker-compose.yml up -d --build
      - name: Verify web health
        run: curl --fail --retry 20 --retry-delay 3 --retry-all-errors http://localhost:3030/api/health
      - name: Show service state
        if: always()
        run: docker compose -f docker/docker-compose.yml ps
      - name: Show logs after failure
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v
