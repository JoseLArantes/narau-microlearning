apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-app
data:
  NODE_ENV: {{ .Values.config.nodeEnv | quote }}
  APP_URL: {{ .Values.config.appUrl | quote }}
  AUTH_URL: {{ .Values.config.authUrl | quote }}
  AUTH_TRUST_HOST: {{ .Values.config.authTrustHost | quote }}
  EMAIL_FROM: {{ .Values.config.emailFrom | quote }}
  SMTP_HOST: {{ .Values.config.smtpHost | quote }}
  SMTP_PORT: {{ .Values.config.smtpPort | quote }}
  SMTP_SECURE: {{ .Values.config.smtpSecure | quote }}
  REDIS_URL: {{ .Values.config.redisUrl | quote }}
  WIKIPEDIA_USER_AGENT: {{ .Values.config.wikipediaUserAgent | quote }}
